name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: important

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: |
          ruff check src tests

      - name: Run Pytest test suite
        run: |
          pytest -v

  frontend-build:
    name: Frontend TypeScript & Bundle Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: important/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: important/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check and build
        run: npm run build
