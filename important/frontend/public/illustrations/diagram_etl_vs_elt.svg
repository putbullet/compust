<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="etlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="eltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="transGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="960" height="480" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />

  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
    Data Pipeline Architecture: ETL vs ELT
  </text>
  <text x="480" y="66" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    Comparing traditional compute-cluster processing with modern cloud Lakehouse in-engine transformations
  </text>

  <!-- TOP HALF: TRADITIONAL ETL -->
  <g transform="translate(40, 95)">
    <!-- Header -->
    <rect x="0" y="0" width="880" height="155" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="32" rx="10" fill="url(#etlGrad)" />
    <text x="80" y="21" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Traditional ETL</text>
    <text x="175" y="21" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Extract $\to$ Transform (Separate Engine) $\to$ Load into Warehouse</text>

    <!-- Block 1: Source -->
    <rect x="30" y="50" width="180" height="80" rx="8" fill="#1e293b" stroke="#475569" />
    <text x="120" y="82" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Raw Sources</text>
    <text x="120" y="102" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10.5">RDBMS, APIs, IoT, Logs</text>

    <!-- Arrow 1 -->
    <path d="M 215 90 L 275 90" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="275,85 285,90 275,95" fill="#60a5fa" />
    <text x="250" y="78" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="10">Extract</text>

    <!-- Block 2: Separate Transform Server -->
    <rect x="290" y="50" width="260" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="420" y="78" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="700">Compute / Transform Cluster</text>
    <text x="420" y="98" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">Dedicated Spark, MapReduce, Airflow</text>
    <text x="420" y="116" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Cleans, transforms, filters outside storage</text>

    <!-- Arrow 2 -->
    <path d="M 555 90 L 635 90" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="635,85 645,90 635,95" fill="#60a5fa" />
    <text x="600" y="78" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="10">Load Cleaned</text>

    <!-- Block 3: Target Warehouse -->
    <rect x="650" y="50" width="200" height="80" rx="8" fill="#1e293b" stroke="#475569" />
    <text x="750" y="82" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Target DWH / RDBMS</text>
    <text x="750" y="102" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Rigid Schemas, High Compute Cost</text>
  </g>

  <!-- BOTTOM HALF: MODERN ELT -->
  <g transform="translate(40, 280)">
    <!-- Header -->
    <rect x="0" y="0" width="880" height="155" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="32" rx="10" fill="url(#eltGrad)" />
    <text x="80" y="21" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Modern ELT</text>
    <text x="175" y="21" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Extract $\to$ Load (Raw Data Lakehouse) $\to$ Transform On-Demand (dbt / SQL Engine)</text>

    <!-- Block 1: Source -->
    <rect x="30" y="50" width="180" height="80" rx="8" fill="#1e293b" stroke="#475569" />
    <text x="120" y="82" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Raw Sources</text>
    <text x="120" y="102" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Databases, Events, Clickstream</text>

    <!-- Arrow 1: Fast Direct Ingestion -->
    <path d="M 215 90 L 335 90" stroke="#34d399" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="335,85 345,90 335,95" fill="#34d399" />
    <text x="280" y="78" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="10">Direct Raw Load</text>

    <!-- Block 2: Cloud Lakehouse Container -->
    <rect x="350" y="45" width="500" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect x="360" y="55" width="220" height="70" rx="6" fill="#0b1120" stroke="#334155" />
    <text x="470" y="82" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="700">Bronze Raw Storage</text>
    <text x="470" y="102" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Delta / Parquet / S3 / GCS</text>

    <!-- Arrow internal -->
    <path d="M 585 90 L 615 90" stroke="#f59e0b" stroke-width="2" />
    <polygon points="615,86 623,90 615,94" fill="#f59e0b" />

    <rect x="625" y="55" width="215" height="70" rx="6" fill="#0b1120" stroke="#f59e0b" />
    <text x="732" y="80" text-anchor="middle" fill="#fcd34d" font-family="sans-serif" font-size="12" font-weight="700">In-Engine Transform</text>
    <text x="732" y="98" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="10">dbt, SQL Models, Star Schema</text>
    <text x="732" y="114" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="9.5">Silver Curated $\to$ Gold Marts</text>
  </g>

  <!-- Key Trade-off footer -->
  <text x="480" y="462" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">
    Interview Insight: ELT preserves raw historical fidelity and leverages elastic MPP warehouse compute; ETL is favored for strict GDPR / PII redaction prior to cloud storage.
  </text>
</svg>
