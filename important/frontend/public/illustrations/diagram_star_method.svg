<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <linearGradient id="starGradS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="starGradT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="starGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="starGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.9" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="420" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header Section -->
  <text x="480" y="44" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
    The STAR Behavioral Interview Framework
  </text>
  <text x="480" y="68" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    Structure compelling, metric-driven answers to behavioral &amp; situational engineering questions
  </text>

  <!-- Flow Arrows connecting the cards -->
  <path d="M 230 200 L 260 200" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <path d="M 460 200 L 490 200" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 690 200 L 720 200" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Step 1: Situation (S) -->
  <g transform="translate(40, 100)" filter="url(#cardShadow)">
    <rect width="190" height="260" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="190" height="48" rx="12" fill="url(#starGradS)" />
    <!-- Round bottom corners fix -->
    <rect x="0" y="36" width="190" height="12" fill="url(#starGradS)" />
    <text x="95" y="30" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">S · Situation</text>
    <text x="95" y="80" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="700">Set the Context (~15%)</text>
    <text x="20" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="11.5" line-height="1.5">
      <tspan x="20" dy="0">• Company / Project scope</tspan>
      <tspan x="20" dy="20">• Technical baseline</tspan>
      <tspan x="20" dy="20">• The critical obstacle</tspan>
      <tspan x="20" dy="20">• Stakeholders involved</tspan>
    </text>
    <rect x="15" y="195" width="160" height="48" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.3" />
    <text x="95" y="215" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="10" font-weight="600">Goal: Concise Backstory</text>
    <text x="95" y="230" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Keep it under 60 seconds</text>
  </g>

  <!-- Step 2: Task (T) -->
  <g transform="translate(270, 100)" filter="url(#cardShadow)">
    <rect width="190" height="260" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="190" height="48" rx="12" fill="url(#starGradT)" />
    <rect x="0" y="36" width="190" height="12" fill="url(#starGradT)" />
    <text x="95" y="30" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">T · Task</text>
    <text x="95" y="80" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700">Define Your Role (~10%)</text>
    <text x="20" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">
      <tspan x="20" dy="0">• Your personal objective</tspan>
      <tspan x="20" dy="20">• Success criteria</tspan>
      <tspan x="20" dy="20">• Constraints (SLA/cost)</tspan>
      <tspan x="20" dy="20">• Risk of non-action</tspan>
    </text>
    <rect x="15" y="195" width="160" height="48" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-opacity="0.3" />
    <text x="95" y="215" text-anchor="middle" fill="#d8b4fe" font-family="sans-serif" font-size="10" font-weight="600">Goal: Ownership Clarity</text>
    <text x="95" y="230" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9.5">State what YOU had to do</text>
  </g>

  <!-- Step 3: Action (A) -->
  <g transform="translate(500, 100)" filter="url(#cardShadow)">
    <rect width="190" height="260" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="190" height="48" rx="12" fill="url(#starGradA)" />
    <rect x="0" y="36" width="190" height="12" fill="url(#starGradA)" />
    <text x="95" y="30" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">A · Action</text>
    <text x="95" y="80" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="700">Execution Depth (~55%)</text>
    <text x="20" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">
      <tspan x="20" dy="0">• Specific steps YOU took</tspan>
      <tspan x="20" dy="20">• Architecture decisions</tspan>
      <tspan x="20" dy="20">• Tools &amp; trade-offs chosen</tspan>
      <tspan x="20" dy="20">• Overcoming blockers</tspan>
    </text>
    <rect x="15" y="195" width="160" height="48" rx="6" fill="#1e293b" stroke="#ec4899" stroke-opacity="0.3" />
    <text x="95" y="215" text-anchor="middle" fill="#fbcfe8" font-family="sans-serif" font-size="10" font-weight="600">Goal: Engineering Rigor</text>
    <text x="95" y="230" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Say "I decided", not "We"</text>
  </g>

  <!-- Step 4: Result (R) -->
  <g transform="translate(730, 100)" filter="url(#cardShadow)">
    <rect width="190" height="260" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="190" height="48" rx="12" fill="url(#starGradR)" />
    <rect x="0" y="36" width="190" height="12" fill="url(#starGradR)" />
    <text x="95" y="30" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">R · Result</text>
    <text x="95" y="80" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">Measurable Impact (~20%)</text>
    <text x="20" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">
      <tspan x="20" dy="0">• Quantified metrics (%, $)</tspan>
      <tspan x="20" dy="20">• Latency / Scale wins</tspan>
      <tspan x="20" dy="20">• Business / Team value</tspan>
      <tspan x="20" dy="20">• Long-term takeaways</tspan>
    </text>
    <rect x="15" y="195" width="160" height="48" rx="6" fill="#1e293b" stroke="#10b981" stroke-opacity="0.3" />
    <text x="95" y="215" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="10" font-weight="600">Goal: Tangible Evidence</text>
    <text x="95" y="230" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Always share numbers!</text>
  </g>

  <!-- Bottom Tip -->
  <text x="480" y="395" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">
    Pro Tip: Balance your answer within 2.5 to 3 minutes. Never stop at the action—interviews prioritize the quantified result.
  </text>
</svg>
